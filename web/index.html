<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LYNQTECH Christmas Lynx</title>
<link rel="icon" href="data:,">
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 38%, #1d5a52 0%, #0d2f3d 48%, #06141f 100%);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: #fff;
    cursor: none;
  }
  #stage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #camera {
    position: fixed;
    right: 2vw;
    bottom: 2vw;
    width: min(25vw, 60vh); /* vh caps keep the size sane on ultra-wide screens */
    border: 3px solid rgba(255, 255, 255, 0.9);
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.55);
    background: #000;
    visibility: hidden;
  }
  #caption {
    position: fixed;
    left: 2vw;
    bottom: 2vw;
    max-width: min(26vw, 62vh); /* A column left of the lynx: the caption must not cover the face */
    padding: 0.5em 0.8em;
    border-radius: 14px;
    background: rgba(4, 16, 24, 0.62);
    font-size: min(2vw, 4.4vh);
    line-height: 1.25;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
    opacity: 0;
    transition: opacity 0.35s;
  }
  #caption.on { opacity: 1; }
  #status {
    position: fixed;
    left: 2vw;
    top: 2vw;
    font-size: min(1.2vw, 2.6vh);
    opacity: 0.75;
  }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<canvas id="stage"></canvas>
<div id="caption"></div>
<img id="camera" alt="Camera preview">
<div id="status"></div>
<script type="module" src="./lynx.js"></script>
</body>
</html>
